<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício</title>
</head>
<body>
    <script>
        function saudacao() {
            document.write("Olá, mundo!<br>");
        }
        saudacao();
    </script>

    <script>
        function exibir_mensagem1(nome) {
            document.write("Bom dia, " + nome + "<br>");
        }

        exibir_mensagem1("Lucas");
    </script>

    <script>
        function exibir_mensagem2(cumprimento, nome) {
            document.write(cumprimento + ", " + nome + "!<br>");
        }

        exibir_mensagem2("Eu ativo", "Pote da Ganância");
    </script>

    <script>
        function somar(a, b) {
            return a + b;
        }

        let resultado = somar(13, 32);

        document.write("Soma: " + resultado + "<br>");
        
        document.write("Soma: " + somar(7, 9) + "<br>");
    </script>
</body>
</html>

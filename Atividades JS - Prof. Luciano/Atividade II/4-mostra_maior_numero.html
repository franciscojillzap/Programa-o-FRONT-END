<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encontrar o Maior Número</title>
</head>
<body>

    <h1>Descubra o Maior Número</h1>

    <label for="num1">Primeiro número:</label>
    <input type="number" id="num1">

    <label for="num2">Segundo número:</label>
    <input type="number" id="num2">

    <label for="num3">Terceiro número:</label>
    <input type="number" id="num3">

    <button onclick="encontrarMaior()">Verificar Maior</button>

    <div id="resultado"></div>

    <script>
        function encontrarMaior() {
            // Captura os valores dos inputs da página e os converte para números decimais
            let n1 = parseFloat(document.getElementById('num1').value);
            let n2 = parseFloat(document.getElementById('num2').value);
            let n3 = parseFloat(document.getElementById('num3').value);
            
            let elementoResultado = document.getElementById('resultado');

            // Validação simples para garantir que todos os campos foram preenchidos corretamente
            if (isNaN(n1) || isNaN(n2) || isNaN(n3)) {
                elementoResultado.style.color = "red";
                elementoResultado.innerText = "Por favor, preencha todos os campos com números válidos.";
                return;
            }

            // Descobre o maior valor
            let maior = Math.max(n1, n2, n3);

            // Exibe a resposta na tela alterando o texto do elemento HTML
            elementoResultado.style.color = "green";
            elementoResultado.innerText = "O maior número digitado é: " + maior;
        }
    </script>

</body>
</html>

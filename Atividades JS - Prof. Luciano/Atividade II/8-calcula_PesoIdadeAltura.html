<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Dados de População</title>
    </style>
</head>
<body>

<div class="container">
    <h1>Cadastro e Análise de Pessoas</h1>
    <p>Insira os dados de 25 pessoas para ver o relatório consolidado.</p>

    <div id="formulario">
        <label for="idade">Idade (anos):</label>
        <input type="number" id="idade" min="0" placeholder="Ex: 25">

        <label for="altura">Altura (metros):</label>
        <input type="number" id="altura" min="0" step="0.01" placeholder="Ex: 1.75">

        <label for="peso">Peso (kg):</label>
        <input type="number" id="peso" min="0" step="0.1" placeholder="Ex: 68.5">
        
        <button onclick="adicionarPessoa()">Adicionar Pessoa</button>
    </div>

    <div class="status" id="contadorStatus">Pessoas cadastradas: 0 de 25</div>
    <div class="error" id="mensagemErro"></div>

    <div class="resultados" id="blocoResultados">
        <h2>Resultados da Análise:</h2>
        <p id="resA"></p>
        <p id="resB"></p>
        <p id="resC"></p>
    </div>
</div>

<script>
    // Vetor que armazenará os objetos com os dados de cada pessoa
    let listaPessoas = [];
    const LIMITE_PESSOAS = 25;

    function adicionarPessoa() {
        let inputIdade = document.getElementById('idade');
        let inputAltura = document.getElementById('altura');
        let inputPeso = document.getElementById('peso');
        let msgErro = document.getElementById('mensagemErro');

        // Limpa mensagens de erro anteriores
        msgErro.innerText = "";

        // Captura e converte os valores
        let idade = parseInt(inputIdade.value);
        let altura = parseFloat(inputAltura.value);
        let peso = parseFloat(inputPeso.value);

        // Validação simples de preenchimento e valores válidos
        if (isNaN(idade) || isNaN(altura) || isNaN(peso) || idade < 0 || altura <= 0 || peso <= 0) {
            msgErro.innerText = "Por favor, preencha todos os campos com valores maiores que zero.";
            return;
        }

        // Adiciona a pessoa à lista
        listaPessoas.push({ idade: idade, altura: altura, peso: peso });

        // Atualiza o contador na tela
        document.getElementById('contadorStatus').innerText = `Pessoas cadastradas: ${listaPessoas.length} de ${LIMITE_PESSOAS}`;

        // Limpa os campos do formulário para a próxima digitação
        inputIdade.value = "";
        inputAltura.value = "";
        inputPeso.value = "";
        inputIdade.focus(); // Coloca o cursor de volta no campo de idade

        // Se atingir o limite de 25 pessoas, calcula os resultados e esconde o formulário
        if (listaPessoas.length === LIMITE_PESSOAS) {
            document.getElementById('formulario').style.display = 'none';
            calcularEstatisticas();
        }
    }

    function calcularEstatisticas() {
        // Variáveis de controle para os cálculos
        let qtdIdadeSuperior50 = 0;
        
        let somaAlturas10a20 = 0;
        let qtdPessoas10a20 = 0;
        
        let qtdPesoInferior40 = 0;

        // Loop para analisar os dados das 25 pessoas cadastradas
        listaPessoas.forEach(function(pessoa) {
            // Regra A: Quantidade de pessoas com idade superior a 50 anos
            if (pessoa.idade > 50) {
                qtdIdadeSuperior50++;
            }

            // Regra B: Pessoas com idade entre 10 e 20 anos (inclusive)
            if (pessoa.idade >= 10 && pessoa.idade <= 20) {
                somaAlturas10a20 += pessoa.altura;
                qtdPessoas10a20++;
            }

            // Regra C: Pessoas com peso inferior a 40 quilos
            if (pessoa.peso < 40) {
                qtdPesoInferior40++;
            }
        });

        // Cálculos finais das médias e percentuais
        let mediaAlturas = qtdPessoas10a20 > 0 ? (somaAlturas10a20 / qtdPessoas10a20).toFixed(2) : 0;
        let percentualPesoBaixo = ((qtdPesoInferior40 / LIMITE_PESSOAS) * 100).toFixed(1);

        // Exibe as informações tratadas nos respectivos elementos da tela
        document.getElementById('resA').innerHTML = `<strong>A.</strong> Pessoas com idade superior a 50 anos: <span>${qtdIdadeSuperior50}</span>`;
        
        if (qtdPessoas10a20 > 0) {
            document.getElementById('resB').innerHTML = `<strong>B.</strong> Média das alturas das pessoas entre 10 e 20 anos: <span>${mediaAlturas} m</span>`;
        } else {
            document.getElementById('resB').innerHTML = `<strong>B.</strong> Média das alturas das pessoas entre 10 e 20 anos: <span>Nenhuma pessoa nessa faixa etária foi cadastrada.</span>`;
        }
        
        document.getElementById('resC').innerHTML = `<strong>C.</strong> Percentual de pessoas com peso inferior a 40 kg: <span>${percentualPesoBaixo}%</span>`;

        // Torna visível o bloco de resultados
        document.getElementById('blocoResultados').style.display = 'block';
        document.getElementById('contadorStatus').innerText = "Processamento concluído para as 25 pessoas!";
    }
</script>

</body>
</html>
